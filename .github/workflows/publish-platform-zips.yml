name: Publish Windows and Linux download ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-platform-zips
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish both platforms
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Python syntax for both platforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          for platform in ('windows', 'linux'):
              internal = Path('src') / platform / '_internal'
              for p in [*internal.glob('*.py'), *internal.glob('*.pyw')]:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
              assert (internal / 'update_manager.py').is_file()
              for required in ('direct_indra_onnx.py','prepare_direct_ocr.py',
                               'image_file_io.py','settings_migration.py'):
                  assert (internal / required).is_file(), (platform, required)
              assert (internal / 'performance_mode.py').is_file()
              assert (internal / 'record_light.py').is_file()
              assert (internal / 'capture_geometry.py').is_file()
              assert (internal / 'combat_log_visibility.py').is_file()
              assert (internal / 'combat_log_background.py').is_file()
              assert (internal / 'damage_row_parser.py').is_file()
              assert (internal / 'attack_crit_integrity.py').is_file()
              assert (internal / 'crit_roll_tables.py').is_file()
              assert (internal / 'crit_damage_metrics.py').is_file()
              assert (Path('src') / platform / 'tests' / 'test_crit_roll_tables_v2.py').is_file()
              assert (internal / 'session_resource_monitor.py').is_file()
              assert (Path('src') / platform / 'tests' / 'test_background_black.py').is_file()
              import json
              defaults = json.loads((internal / 'config.json').read_text())
              assert defaults['performance']['mode'] == 'light'
              assert defaults['live_dps']['ocr_engine'] == 'indra_direct'
              assert defaults['release_migrations']['light_direct_defaults_20261106'] is True
              assert 'onnxruntime' in (internal / 'requirements.txt').read_text()
              assert "'mode', 'light'" in (internal / 'performance_mode.py').read_text()
              assert 'visibility_guard.inspect(gray)' in (internal / 'live_overlay.py').read_text()
              assert 'def _preflight_capture(' in (internal / 'continuous_live.py').read_text()
              assert "self.performance_combo" in (internal / 'DDO Combat Analyzer.pyw').read_text()
              assert "self.ocr_engine_combo" in (internal / 'DDO Combat Analyzer.pyw').read_text()
              assert "apply_release_defaults" in (internal / 'launch_gui.py').read_text()
              assert "--light" in (internal / 'process_latest.py').read_text()
              assert "LiveResourceTracker" in (internal / 'continuous_live.py').read_text()
              assert 'UpdateController(' in (internal / 'DDO Combat Analyzer.pyw').read_text()
              assert 'self.version_label = ttk.Label' in (internal / 'DDO Combat Analyzer.pyw').read_text()
              print(platform, 'Python syntax and updater UI OK')
          PY

      - name: Run parser, Direct OCR, migration and background tests on both platforms
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy opencv-python-headless
          for platform in windows linux; do
            ( cd "src/$platform" && python -m unittest discover -s tests -v )
          done

      - name: Build independently installable Windows and Linux ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/staging/windows dist/staging/linux
          cp -a src/windows/. dist/staging/windows/
          cp -a src/linux/. dist/staging/linux/
          # Test files and generated Python bytecode are not application files.
          # The automatic updater accepts only its documented file allowlist.
          rm -rf dist/staging/windows/tests dist/staging/linux/tests
          find dist/staging -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist/staging -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          for platform in windows linux; do
            cp LICENSE THIRD_PARTY_NOTICES.md "dist/staging/$platform/"
            printf 'DDO Combat Analyzer\nSource commit: %s\n' "$GITHUB_SHA" > "dist/staging/$platform/VERSION.txt"
            test -s "dist/staging/$platform/_internal/DDO Combat Analyzer.pyw"
            test -s "dist/staging/$platform/_internal/record_optimized.py"
            test -s "dist/staging/$platform/_internal/process_latest.py"
            test -s "dist/staging/$platform/_internal/update_manager.py"
            test -s "dist/staging/$platform/_internal/performance_mode.py"
            test -s "dist/staging/$platform/_internal/record_light.py"
            test -s "dist/staging/$platform/_internal/direct_indra_onnx.py"
            test -s "dist/staging/$platform/_internal/prepare_direct_ocr.py"
            test -s "dist/staging/$platform/_internal/settings_migration.py"
            test -s "dist/staging/$platform/LICENSE"
            test ! -e "dist/staging/$platform/LOCAL_TEST_VERSION.txt"
          done
          test -s 'dist/staging/windows/SETUP DDO Combat Analyzer.cmd'
          test -s 'dist/staging/windows/START DDO Combat Analyzer.cmd'
          test -s 'dist/staging/linux/SETUP DDO Combat Analyzer.sh'
          test -s 'dist/staging/linux/START_DDO_COMBAT_ANALYZER.sh'
          chmod +x 'dist/staging/linux/SETUP DDO Combat Analyzer.sh' \
                   'dist/staging/linux/START_DDO_COMBAT_ANALYZER.sh'
          (
            cd dist/staging/windows
            zip -q -r -9 -X ../../DDO-Combat-Analyzer-Windows.zip .
          )
          (
            cd dist/staging/linux
            zip -q -r -9 -X ../../DDO-Combat-Analyzer-Linux.zip .
          )
          unzip -tqq dist/DDO-Combat-Analyzer-Windows.zip
          unzip -tqq dist/DDO-Combat-Analyzer-Linux.zip
          unzip -p dist/DDO-Combat-Analyzer-Windows.zip 'VERSION.txt' | grep -F "$GITHUB_SHA"
          unzip -p dist/DDO-Combat-Analyzer-Linux.zip 'VERSION.txt' | grep -F "$GITHUB_SHA"

          # Exercise the strict in-app updater against BOTH release archives.
          python - <<'PY'
          import os
          import runpy
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ['GITHUB_SHA']
          tag = f"v{datetime.now(timezone.utc):%Y.%m.%d}-{sha[:8]}"
          with tempfile.TemporaryDirectory() as temp:
              for platform in ('windows', 'linux'):
                  path = Path('src') / platform / '_internal' / 'update_manager.py'
                  update = runpy.run_path(str(path))
                  archive = Path('dist') / ('DDO-Combat-Analyzer-' + platform.capitalize() + '.zip')
                  approved_files = update['prepare_update'](
                      archive, Path(temp) / platform, {'platform': platform, 'tag': tag}
                  )
                  assert len(approved_files) > 20, (platform, len(approved_files))
                  print(f'{platform}: updater accepts {len(approved_files)} release files')
          PY
          sha256sum dist/DDO-Combat-Analyzer-*.zip

      - name: Publish versioned GitHub Release containing both platforms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="v$(date -u +%Y.%m.%d)-${short_sha}"
          cat > dist/RELEASE_NOTES.md <<EOF
          DDO Combat Analyzer for Windows and Linux (X11).

          - **Capture selection:** The on-screen selector, first-run guide and main GUI now explicitly exclude the bottom chat input (Say, Group, Guild or any other channel), scrollbar and window borders. Capturing only the scrolling Combat Log text prevents missing attack and damage lines.
          - **Scope:** This update changes selection guidance only; OCR and damage parsing behavior are unchanged.
          - **New:** Indra Direct ONNX recognition-only OCR is the default on Windows and Linux, with Indra Full still available as fallback.
          - **Light:** 20-FPS OCR tracking, at most 2 OCR threads, no FFmpeg/video capture or redundant screenshot diagnostics. Saved live OCR supports rebuilding reports, not independent video reanalysis.
          - **Defaults on NEW and UPDATED installations:** Light and Indra Direct. A one-time migration applies these settings to saved configurations, retaining capture area, other settings and session history. Future user changes are preserved.
          - **Fixed:** Critical confirmations with a comma or period after the target are now parsed. 39/39 confirmations restored in a real Direct session without changing 258 damage events or 1,112,771 damage. Existing wrapped damage, B/8, background and numeric-guard fixes remain.
          - **Capture sync:** Live OCR refreshes the exact Combat Log rectangle before each Full/Light recording and verifies it against the recorder; mismatches abort live collection instead of silently corrupting DPS.
          - **Scroll recovery:** Confident prior-frame alignment recovers scrolls missed by stale anchors; long unresolved stalls are diagnosed rather than guessed.
          - **Zoning protection:** Detects loading/hidden Combat Log, suspends OCR while hidden and re-baselines on return to avoid re-counting old damage. Rolling DPS still decays after the selected inactivity window.
          - **Diagnostics:** Saves idle zoning transitions in _internal/live_zone_diagnostics.jsonl (bounded), plus per-session zoning and capture geometry checks; Replay Live and FFV1 also avoid re-parsing returning chat.
          - **Fix:** Both downloadable ZIPs exclude source-only tests and Python bytecode; GitHub Actions verifies updater compatibility for Windows and Linux before publishing.
          - **Testing:** Local simulated zoning and live/replay integration passed; a longer real in-game zoning-after-damage regression test is still recommended.
          - **Windows:** Download DDO-Combat-Analyzer-Windows.zip, extract it, run SETUP DDO Combat Analyzer.cmd once, then START DDO Combat Analyzer.cmd.
          - **Linux (Mint/Cinnamon X11):** Download DDO-Combat-Analyzer-Linux.zip, extract it, run bash 'SETUP DDO Combat Analyzer.sh' once, then ./START_DDO_COMBAT_ANALYZER.sh.
          - **Setup/upgrade:** Windows/Linux SETUP installs ONNX Runtime and verifies the separately downloaded pinned Indra v1.1.0 rec.onnx model. Auto-upgraded installations bootstrap missing Direct requirements in the background without deleting configurations or combat sessions.
          - **Verification:** Windows Light + Direct recovered 258/258 damage events and matched target HP within 1 (float32 display precision). Parser, Direct preprocessing and one-time migration tests are included for both platforms. Linux X11 in-game validation is still recommended.
          - Both ZIPs include the application source and license notices. Third-party dependencies and Indra model weights have separate licenses.
          - Source commit: ${GITHUB_SHA}.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/DDO-Combat-Analyzer-Windows.zip \
              dist/DDO-Combat-Analyzer-Linux.zip --clobber
            gh release edit "$tag" --notes-file dist/RELEASE_NOTES.md --latest
          else
            gh release create "$tag" \
              dist/DDO-Combat-Analyzer-Windows.zip \
              dist/DDO-Combat-Analyzer-Linux.zip \
              --target "$GITHUB_SHA" \
              --title "DDO Combat Analyzer (${tag})" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest
          fi

          # Verify BOTH download files before deleting ANY previous release.
          current_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fx 'DDO-Combat-Analyzer-Windows.zip' <<<"$current_assets"
          grep -Fx 'DDO-Combat-Analyzer-Linux.zip' <<<"$current_assets"

          # Delete superseded releases only AFTER both new ZIPs are verified.
          # Never delete the newly published one. --cleanup-tag also removes
          # historical version tags, so the Releases page shows one version.
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
            echo "Removing superseded release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')

          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          [[ "$remaining" == "$tag" ]] || {
            echo "Unexpected remaining Releases: $remaining" >&2
            exit 1
          }
          echo "Published and verified the sole release: $tag"
